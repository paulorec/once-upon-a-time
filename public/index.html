<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Once Upon a Time</title>
<meta name="description" content="Diário de histórias infantis com o Biju, um carrinho curioso e corajoso.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#a8471f">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Once Upon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: um diário aberto sobre a mesa. Cada dia é uma página pautada; folheia-se com setas, gestos ou pelo sumário. */
:root{
  --desk:#e6e1ee; --paper:#fffdf7; --paper-edge:#efe9dc; --rule:#dbe5f1; --margin:#f0a9a9;
  --ink:#2d2a3e; --pencil:#77718a; --chip:#f3eee3; --night:#24305e;
  --accent:#ff7a3d; --accent-ink:#ffffff; --car:#ff7a3d; --cover:#a8471f;
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --sky1:#9fd8f5; --sky2:#e6f6ff; --hill1:#8fcf7a; --hill2:#6bb862; --road:#5d5a6b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101226; --paper:#1d2136; --paper-edge:#161a2c; --rule:#2a3150; --margin:#6e3a50;
  --ink:#eeeaf7; --pencil:#a7a2bd; --chip:#2a2f4a; --accent-ink:#1d2136; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#101226; --paper:#1d2136; --paper-edge:#161a2c; --rule:#2a3150; --margin:#6e3a50;
  --ink:#eeeaf7; --pencil:#a7a2bd; --chip:#2a2f4a; --accent-ink:#1d2136; color-scheme:dark}

.s-manha{--sky1:#9fd8f5;--sky2:#fff3d6;--hill1:#9bd884;--hill2:#6bb862;--road:#5d5a6b}
.s-tarde{--sky1:#6ec3f0;--sky2:#d6f0ff;--hill1:#8fcf7a;--hill2:#5fae58;--road:#5d5a6b}
.s-entardecer{--sky1:#f6a26b;--sky2:#ffd9a0;--hill1:#7aa86a;--hill2:#5b8a55;--road:#5d5a6b}
.s-dormir{--sky1:#141a3d;--sky2:#2c3a78;--hill1:#2c4a4a;--hill2:#1f3838;--road:#3a3850}

*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--hand);font-size:17px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 28px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}

.shell{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:4px}
.top h1{font-size:1.45rem;line-height:1.1}
.top h1 small{display:block;font-size:.95rem;color:var(--pencil)}
.top-actions{display:flex;gap:6px}
.pill{border:0;background:var(--paper);border-radius:999px;padding:7px 14px;font-size:1rem;box-shadow:0 1px 0 var(--paper-edge),0 2px 6px rgba(0,0,0,.08)}

/* O livro */
.book{position:relative;perspective:1400px}
.page{position:relative;background:var(--paper);border-radius:6px 16px 16px 6px;min-height:72vh;
  padding:22px 18px 30px 46px;
  box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.28),0 1px 0 var(--paper-edge),0 3px 0 var(--paper-edge),0 5px 0 var(--paper-edge),0 12px 28px rgba(20,16,50,.16);
  background-image:linear-gradient(transparent 0 calc(2rem - 1px),var(--rule) calc(2rem - 1px) 2rem);
  background-size:100% 2rem;background-position:0 1.2rem;
  transform-origin:left center;}
.page::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:var(--margin);opacity:.8}
.page>*{position:relative}
.ribbon{position:absolute;top:-6px;right:26px;width:18px;height:58px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.9}

.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;padding-right:30px}
.p-date{font-size:1.35rem;line-height:1.2}
.p-num{color:var(--pencil);font-size:.95rem;white-space:nowrap}

.photo{background:#fff;padding:8px 8px 10px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.18);transform:rotate(-1.3deg);margin:4px 4px 18px;position:relative;line-height:0;max-width:100%}
.photo svg{width:100%;height:auto;display:block;border-radius:2px}
.photo::before,.photo::after{content:"";position:absolute;width:62px;height:20px;background:var(--car);opacity:.45;top:-8px}
.photo::before{left:-10px;transform:rotate(-24deg)}
.photo::after{right:-10px;transform:rotate(22deg)}
.photo figcaption{line-height:1.25;font-size:1rem;color:#4a4560;padding:8px 4px 0}

.p-title{font-size:1.75rem;line-height:1.15;margin:6px 0 4px}
.p-meta{color:var(--pencil);font-size:1rem;margin-bottom:8px}
.story{font-family:var(--read);font-size:1.08rem;line-height:2rem;max-width:62ch}
.story p{margin:0 0 2rem}
.caret::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.status{color:var(--pencil);font-size:1rem;margin:4px 0 10px}
.p-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.link{border:0;background:var(--chip);border-radius:999px;padding:6px 14px;font-size:1rem}
.link.warn{background:var(--accent);color:var(--accent-ink)}

/* Página de hoje, ainda em branco */
.prompt{font-size:1.6rem;line-height:1.2;margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--chip);border-radius:999px;padding:3px 11px;font-size:.98rem}
.chip.hot{background:var(--accent);color:var(--accent-ink)}
.bedtime{background:var(--night);color:#f1edf9;border-radius:12px;padding:10px 14px;font-size:1.05rem;line-height:1.35;margin-bottom:14px}
.ideas{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:4px}
.idea{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:2px 10px;padding:6px 6px;border-radius:10px;width:100%}
.idea:hover{background:var(--chip)}
.idea:focus-visible{outline:3px solid var(--accent)}
.idea .dot{width:16px;height:16px;border:2px solid var(--pencil);border-radius:50%;margin-top:6px;grid-row:span 2}
.idea:hover .dot{border-color:var(--accent);background:var(--accent)}
.idea b{font-weight:400;font-size:1.22rem;line-height:1.3;min-width:0}
.idea span{font-family:var(--read);font-size:.92rem;color:var(--pencil);line-height:1.5;min-width:0}
.own{display:flex;gap:8px;margin-bottom:12px}
.own input{flex:1;min-width:0;border:0;border-bottom:2px dashed var(--pencil);background:transparent;color:var(--ink);font:inherit;font-size:1.15rem;padding:6px 2px}
.own input::placeholder{color:var(--pencil);opacity:.8}
.go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 16px;font-size:1.1rem}
.opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--pencil)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:3px 12px;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Navegação */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-inline:4px}
.nav button{border:0;background:var(--paper);border-radius:12px;padding:9px 12px;font-size:1.05rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .next{justify-self:end}
.nav .prev{justify-self:start}
.nav .where{color:var(--pencil);font-size:1rem;text-align:center}
.hint{text-align:center;color:var(--pencil);font-size:.92rem}

/* Folhear */
.out-next{animation:outNext .26s ease-in forwards}
.out-prev{animation:outPrev .26s ease-in forwards}
.in-next{animation:inNext .3s ease-out}
.in-prev{animation:inPrev .3s ease-out}
@keyframes outNext{to{transform:rotateY(-24deg) translateX(-10%);opacity:0}}
@keyframes outPrev{to{transform:rotateY(18deg) translateX(10%);opacity:0}}
@keyframes inNext{from{transform:rotateY(18deg) translateX(10%);opacity:0}}
@keyframes inPrev{from{transform:rotateY(-24deg) translateX(-10%);opacity:0}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.out-next,.out-prev,.in-next,.in-prev,.bob,.caret::after{animation:none}}

/* Sumário e ajustes */
dialog{border:0;border-radius:16px;background:var(--paper);color:var(--ink);width:min(520px,calc(100vw - 28px));max-height:84vh;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(16,14,40,.45)}
.toc h2,.form h2{font-size:1.6rem;margin-bottom:6px}
.toc-month{color:var(--pencil);font-size:1.05rem;margin:12px 0 2px;text-transform:capitalize}
.toc-item{all:unset;cursor:pointer;display:grid;grid-template-columns:3.2rem 1fr;gap:10px;padding:6px 4px;border-bottom:1px dashed var(--rule);width:100%;box-sizing:border-box}
.toc-item:focus-visible{outline:3px solid var(--accent)}
.toc-item .d{color:var(--pencil)}
.toc-item .t{font-size:1.15rem;min-width:0}
.toc-item.current .t{color:var(--accent)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:1.05rem}
.form input,.form textarea{border:2px solid var(--rule);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;font-family:var(--read);font-size:.95rem}
.form textarea{min-height:70px;resize:vertical}
.colors{display:flex;gap:10px}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-actions{display:flex;gap:8px;justify-content:flex-end}

/* Sumário */
.toc-title{font-size:2.2rem;line-height:1.1}
.toc-sec{font-size:1.35rem;color:var(--accent);margin:10px 0 8px}
section+section{margin-top:22px}
.photo.small{max-width:340px}
.empty{font-family:var(--read);color:var(--pencil);font-size:.98rem;line-height:2rem;margin:0}
.toc-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:3.6rem 1fr auto;align-items:baseline;gap:8px;width:100%;padding:4px 4px;border-radius:8px;min-height:2rem}
.toc-row:hover{background:var(--chip)}
.toc-row:focus-visible{outline:3px solid var(--accent)}
.toc-row .d{color:var(--pencil);font-size:1rem}
.toc-row .t{display:flex;align-items:baseline;gap:6px;font-size:1.2rem;line-height:1.3;min-width:0}
.toc-row .t::after{content:"";flex:1;min-width:16px;border-bottom:2px dotted var(--pencil);opacity:.55;transform:translateY(-4px)}
.toc-row .n{color:var(--pencil);font-size:1.05rem;font-variant-numeric:tabular-nums}

/* Capa */
.page.cover{background-color:var(--cover);color:#f7efdf;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px),radial-gradient(rgba(0,0,0,.10) 1px,transparent 1.5px);
  background-size:5px 5px,7px 7px;background-position:0 0,2px 3px;
  padding:40px 58px 34px 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  border-radius:8px 18px 18px 8px;
  box-shadow:inset 20px 0 22px -12px rgba(0,0,0,.5),inset 3px 0 0 rgba(0,0,0,.25),0 1px 0 #e8e1d3,0 3px 0 #ddd5c4,0 5px 0 #d2c9b6,0 14px 30px rgba(20,16,50,.3)}
.page.cover::before{left:18px;right:14px;top:14px;bottom:14px;width:auto;background:none;opacity:1;border:2px dashed rgba(247,239,223,.4);border-radius:6px 12px 12px 6px}
.strap{position:absolute;top:0;bottom:0;right:24px;width:16px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.3) 40%,rgba(255,255,255,.12) 50%,rgba(0,0,0,.35));box-shadow:0 0 6px rgba(0,0,0,.35)}
.corner{position:absolute;right:0;width:30px;height:30px;background:linear-gradient(135deg,#efe0b4,#b99a55)}
.corner.t{top:0;border-top-right-radius:18px;clip-path:polygon(0 0,100% 0,100% 100%)}
.corner.b{bottom:0;border-bottom-right-radius:18px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.emboss{font-size:1rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,239,223,.78)}
.cover-title{font-size:2.7rem;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35),0 -1px 0 rgba(255,255,255,.18)}
.oval{width:min(240px,100%);aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid #f7efdf;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.35);line-height:0}
.oval svg{width:100%;height:100%;display:block}
.plate{background:#fbf6ea;color:#2d2a3e;padding:10px 22px 12px;border-radius:8px;box-shadow:inset 0 0 0 2px #e2d8c3,inset 0 0 0 5px #fbf6ea,inset 0 0 0 6px #e2d8c3,0 3px 6px rgba(0,0,0,.35);max-width:100%}
.plate small{display:block;font-size:1rem;color:#6d6880}
.plate strong{display:block;font-weight:400;font-size:2rem;line-height:1.1;overflow-wrap:anywhere}
.cover-meta{font-size:1.05rem;color:rgba(247,239,223,.85)}
.open{border:0;background:#f7efdf;color:var(--cover);border-radius:999px;padding:10px 24px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.open:hover{transform:translateY(-1px)}
.opening{animation:openCover .45s ease-in forwards}
@keyframes openCover{to{transform:rotateY(-100deg);opacity:.15}}
@media (prefers-reduced-motion:reduce){.opening{animation:none}}

@media (max-width:420px){.page{padding-left:40px;padding-right:14px}.page::before{left:28px}.p-title{font-size:1.55rem}
  .page.cover{padding:36px 50px 30px 36px}.cover-title{font-size:2.3rem}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1 id="bookTitle">Diário de histórias<small id="bookSub">Once Upon a Time</small></h1>
    <div class="top-actions">
      <button class="pill" id="installBtn" hidden>Instalar</button>
      <button class="pill" id="openToc">Sumário</button>
      <button class="pill" id="openSettings">Ajustes</button>
    </div>
  </header>

  <div class="book" id="book">
    <article class="page" id="page" aria-live="polite"></article>
  </div>

  <nav class="nav" aria-label="Folhear o diário">
    <button class="prev" id="prev">‹ Dia anterior</button>
    <div class="where" id="where"></div>
    <button class="next" id="next">Próximo dia ›</button>
  </nav>
  <div class="hint">Arraste a página para os lados para folhear</div>
</div>

<dialog id="settings">
  <form class="form" method="dialog">
    <h2>Ajustes</h2>
    <div class="row2">
      <label>Nome da criança<input id="sKid" placeholder="Ex.: Lia"></label>
      <label>Idade<input id="sAge" type="number" min="1" max="12" placeholder="5"></label>
    </div>
    <div class="row2">
      <label>Nome do carrinho<input id="sCar"></label>
      <label>Aniversário (dd/mm)<input id="sBday" placeholder="Ex.: 03/05"></label>
    </div>
    <label>Cor do carrinho<div class="colors" id="sColors"></div></label>
    <label>Jeitinho do carrinho<textarea id="sPers"></textarea></label>
    <label>Hora de dormir<input id="sBed" type="time"></label>
    <div class="d-actions">
      <button class="link" value="cancel">Cancelar</button>
      <button class="go" id="saveSet" value="ok">Salvar</button>
    </div>
  </form>
</dialog>

<script>
(function(){
const COLORS={laranja:"#ff7a3d",turquesa:"#1fb5a8",vermelho:"#e84855",amarelo:"#f5b700",azul:"#3d7cff"};
const COVERS={laranja:"#a8471f",turquesa:"#12645f",vermelho:"#8c2232",amarelo:"#8f6200",azul:"#22438c"};
const DEF={kid:"",age:5,car:"Biju",color:"laranja",bday:"",bed:"19:30",
  pers:"curioso e corajoso, adora fazer amigos pelo caminho, buzina \"bi-bi!\" quando fica feliz e tem um pouquinho de medo do escuro, mas acende os faróis e segue em frente",len:""};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=Object.assign({},DEF,load("hb_set",{}));
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fill(t){return t.replace(/\{car\}/g,S.car)}

/* ---------- Histórias do diário ---------- */
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateOfKey(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
let stories=load("oua_stories",null);
if(!stories){ // traz as histórias das versões anteriores
  stories=[];
  const old=load("oua_days",null);
  if(old)Object.keys(old).forEach(k=>{const e=old[k];if(e&&e.paras)stories.push(Object.assign({},e,{at:e.at||dateOfKey(k).getTime()}))});
  else load("hb_hist",[]).forEach(h=>{if(h&&h.at&&h.paras)stories.push({title:h.title,paras:h.paras,at:h.at,p:"tarde",season:season(new Date(h.at)).name})});
  stories.forEach(s=>{s.id="h"+s.at});
  save("oua_stories",stories);
}
stories.sort((a,b)=>a.at-b.at);
function storyById(id){return stories.find(s=>s.id===id)}
const CAPA="capa",SUMARIO="sumario",NOVA="nova";
function recentlyOpened(){try{return Date.now()-Number(sessionStorage.getItem("oua_open")||0)<30*60*1000}catch(e){return false}}
function markOpened(){try{sessionStorage.setItem("oua_open",String(Date.now()))}catch(e){}}
let cur=recentlyOpened()?SUMARIO:CAPA;
let draft=null;   // história sendo escrita agora
function sequence(){const q=[CAPA,SUMARIO,...stories.map(s=>s.id)];if(draft)q.push(NOVA);return q}

/* ---------- Data e contexto ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function nthSunday(y,m,n){const d=new Date(y,m,1);const off=(7-d.getDay())%7;return new Date(y,m,1+off+7*(n-1))}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function specialDates(y){
  const E=easter(y);
  // [data, nome (só interno), tema enviado à IA, título visível, chamada visível]
  const L=[
    [new Date(y,0,1),"Ano Novo","um começo de ano cheio de desejos bons, fogos coloridos no céu e promessas de aventura","{car} e o céu que virou festa","Uma noite em que o céu inteiro brilhou de mil cores."],
    [addDays(E,-47),"Carnaval","um desfile de carnaval com fantasias, confete, frevo e marchinhas pela cidade","{car} e a fantasia mais colorida da rua","Confete, música e uma fantasia que ninguém esperava."],
    [E,"Páscoa","uma caça aos ovos de chocolate escondidos pela cidade e o valor de dividir com os amigos","{car} e os ovinhos escondidos","Uma trilha de surpresas espalhadas pela cidade."],
    [new Date(y,3,18),"Dia do Livro Infantil","uma biblioteca mágica onde as histórias saem dos livros","{car} e o livro que falava","Uma biblioteca onde as histórias pulam das páginas."],
    [new Date(y,3,19),"Dia dos Povos Indígenas","uma visita a uma aldeia onde aprende sobre a floresta, os rios e as histórias dos povos indígenas","{car} e os guardiões da floresta","Uma viagem até onde o rio canta e as árvores contam histórias."],

  ];
  if(S.bday&&/^\d{1,2}\/\d{1,2}$/.test(S.bday)){const[d,m]=S.bday.split("/").map(Number);
    L.push([new Date(y,m-1,d),"Aniversário"+(S.kid?" de "+S.kid:""),"uma festa de aniversário surpresa"+(S.kid?" para "+S.kid:"")+", com bolo, balões e amigos","{car} e a festa surpresa","Balões, bolo e um segredo muito bem guardado."]);}
  return L.map(([date,name,theme,title,teaser])=>({date,name,theme,title,teaser}));

function nearbyDates(now){
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const all=[...specialDates(t.getFullYear()-1),...specialDates(t.getFullYear()),...specialDates(t.getFullYear()+1)];
  return all.map(s=>({...s,diff:Math.round((s.date-t)/864e5)})).filter(s=>s.diff>=-5&&s.diff<=15).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff));
}
function season(now){
  const md=now.getMonth()*100+now.getDate();
  if(md>=822&&md<1121)return{name:"primavera",theme:"a primavera chegando, flores abrindo e borboletas pelo caminho"};
  if(md>=1121||md<220)return{name:"verão",theme:"um dia de verão bem quente, praia, picolé e água de coco"};
  if(md>=220&&md<520)return{name:"outono",theme:"o outono, com ventinho fresco, folhas e pipas no céu"};
  return{name:"inverno",theme:"a época de chuva, com poças para pular, guarda-chuvas e arco-íris"};
}
function bedMinutes(){const[h,m]=(S.bed||"19:30").split(":").map(Number);return h*60+(m||0)}
function period(now){
  const mins=now.getHours()*60+now.getMinutes(),bed=bedMinutes();
  if(mins>=bed||mins<5*60)return"dormir";
  if(mins>=bed-60)return"entardecer";
  if(mins<12*60)return"manha";
  if(mins<17*60+30)return"tarde";
  return"entardecer";
}
const PERIOD={
  manha:{label:"manhã",hello:"Bom dia! O {car} já acordou com o tanque cheio de energia.",idea:["{car} e o café da manhã no posto","Um passeio cedinho para ver o sol acordar a cidade, cumprimentando todo mundo pelo caminho."],theme:"uma manhã animada, café da manhã e um dia começando"},
  tarde:{label:"tarde",hello:"Boa tarde! O {car} está pronto para uma aventura.",idea:["{car} e o mapa do tesouro","Uma tarde de aventura atrás de um tesouro escondido no parque."],theme:"uma aventura à tarde, com um mapa e um mistério divertido"},
  entardecer:{label:"fim de tarde",hello:"O sol está indo embora, e o {car} está voltando devagarinho para casa.",idea:["{car} e o pôr do sol cor de laranja","O caminho de volta para casa, com o céu mudando de cor e os amigos dando tchau."],theme:"o fim da tarde, voltando para casa e se preparando para a noite"},
  dormir:{label:"hora de dormir",hello:"Shhh… O {car} está estacionando na garagem para dormir.",idea:["{car} conta as estrelas","Deitado na garagem, o {car} olha pela janela e conta estrelinhas até o sono chegar."],theme:"hora de dormir, uma história calma e aconchegante que termina com o personagem dormindo tranquilo"}
};
let CTX;
function buildContext(){
  const now=new Date();
  CTX={now,p:period(now),se:season(now),dates:nearbyDates(now),
    dow:now.toLocaleDateString("pt-BR",{weekday:"long"}),
    dateStr:now.toLocaleDateString("pt-BR",{day:"numeric",month:"long"}),
    hh:now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
    wknd:[0,6].includes(now.getDay())};
  return CTX;
}
function when(d){if(d===0)return"é hoje";if(d===1)return"é amanhã";if(d===-1)return"foi ontem";return d>0?"daqui a "+d+" dias":"foi há "+(-d)+" dias"}

// As sugestões mostram só o título e uma chamada. Data, horário e estação ficam escondidos no tema enviado à IA.
const SEASON_IDEA={
  primavera:["{car} e o jardim que acordou","Um jardim inteiro acordando de repente."],

function ideas(){
  const {p,se,dates,wknd}=CTX,L=[];
  if(p==="dormir"){
    const calmo=" Uma história calma e aconchegante, que termina com o personagem dormindo tranquilo.";
    L.push({title:fill(PERIOD.dormir.idea[0]),desc:fill(PERIOD.dormir.idea[1]),theme:PERIOD.dormir.theme});

    L.push({title:"A canção de ninar dos faróis",desc:fill("O {car} apaga os faróis um por um, e cada luz dá boa noite a um amigo."),theme:"apagar as luzes e dar boa noite aos amigos, uma história repetitiva e sonolenta"});
    L.push({title:fill("{car} e os barulhinhos da noite"),desc:"Grilos, vento e uma chuva bem fininha lá fora.",theme:"os sons calmos de uma noite de "+se.name+"."+calmo});
  }else{
    dates.slice(0,2).forEach(d=>L.push({title:fill(d.title),desc:d.teaser,theme:d.theme+" ("+d.name+", "+when(d.diff)+")"}));
    L.push({title:fill(PERIOD[p].idea[0]),desc:fill(PERIOD[p].idea[1]),theme:PERIOD[p].theme});
    const si=SEASON_IDEA[se.name];
    L.push({title:fill(si[0]),desc:si[1],theme:se.theme});

  }
  return L.slice(0,4).map(it=>({...it,fixedTitle:true}));
}

/* ---------- Páginas ---------- */
let note="",noteFor=null,confirmDel=false;
function longDate(ts){return cap(new Date(ts).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}))}
function shortDate(ts){return new Date(ts).toLocaleDateString("pt-BR",{day:"numeric",month:"short"}).replace(".","")}
function pageNo(id){return stories.findIndex(s=>s.id===id)+1}
function typing(){const a=document.activeElement;return !!(a&&a.closest&&a.closest("input,textarea"))}

function render(){
  buildContext();
  const color=COLORS[S.color]||COLORS.laranja,cover=COVERS[S.color]||COVERS.laranja;
  const st=document.documentElement.style;
  st.setProperty("--car",color);st.setProperty("--accent",color);st.setProperty("--cover",cover);
  const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content",cover);
  $("bookTitle").firstChild.nodeValue=S.kid?"Diário de histórias de "+S.kid:"Diário de histórias";
  $("bookSub").textContent="Once Upon a Time · com o "+S.car;

  const q=sequence();if(!q.includes(cur))cur=SUMARIO;
  const pg=$("page");pg.classList.toggle("cover",cur===CAPA);
  if(cur===CAPA){renderCover();return}
  if(cur===SUMARIO)renderSumario();
  else if(cur===NOVA)renderDraft();
  else renderStory(storyById(cur));

  const i=q.indexOf(cur),before=q[i-1];
  $("prev").disabled=false;
  $("prev").textContent=before===CAPA?"‹ Capa":before===SUMARIO?"‹ Sumário":"‹ Anterior";
  $("next").disabled=i>=q.length-1;
  $("next").textContent=cur===SUMARIO?"Primeira história ›":"Próxima ›";
  $("where").textContent=cur===SUMARIO?"sumário":cur===NOVA?"escrevendo…":"pág. "+pageNo(cur)+" de "+stories.length;
}

function renderCover(){
  const n=stories.length,since=n?new Date(stories[0].at).toLocaleDateString("pt-BR",{day:"numeric",month:"long"}):"";
  $("page").innerHTML='<span class="strap" aria-hidden="true"></span><span class="corner t" aria-hidden="true"></span><span class="corner b" aria-hidden="true"></span>'+
    '<div class="emboss">Once Upon a Time</div>'+
    '<h2 class="cover-title">Diário de histórias</h2>'+
    '<div class="oval">'+sceneSVG(CTX.p,CTX.se.name).replace("<svg ",'<svg preserveAspectRatio="xMidYMid slice" ')+'</div>'+
    '<div class="plate">'+(S.kid?'<small>este diário é de</small><strong>'+esc(S.kid)+'</strong>':'<small>histórias do</small><strong>'+esc(S.car)+'</strong>')+'</div>'+
    '<div class="cover-meta">'+(n?n+(n===1?" história":" histórias")+" · desde "+esc(since):"Um diário novinho, esperando a primeira história")+'</div>'+
    '<button class="open" id="openBook">Abrir o diário</button>';
  $("openBook").onclick=openBook;
  $("prev").disabled=true;$("prev").textContent="‹ Anterior";
  $("next").disabled=false;$("next").textContent="Abrir ›";
  $("where").textContent="capa";

function renderSumario(){
  const its=ideas(),len=S.len||(CTX.p==="dormir"?"curta":"media");
  let h='<div class="p-head"><h2 class="toc-title">Sumário</h2></div>';
  h+='<section aria-labelledby="secNova"><h3 class="toc-sec" id="secNova">Uma nova história</h3>';
  h+=photo(CTX.p,CTX.se.name,fill(PERIOD[CTX.p].hello),"small");
  if(draft)h+='<p><button class="link warn" id="goDraft">O '+esc(S.car)+' está escrevendo “'+esc(draft.title)+'”. Ver agora</button></p>';
  h+='<ul class="ideas" id="ideas">'+its.map((it,j)=>'<li><button class="idea" data-i="'+j+'"><i class="dot"></i><b>'+esc(it.title)+'</b><span>'+esc(it.desc)+'</span></button></li>').join("")+'</ul>';
  h+='<form class="own" id="ownForm"><input id="ownTheme" placeholder="Ou escreva um tema: o '+esc(S.car)+' aprende a nadar…" autocomplete="off"><button class="go" type="submit">Contar</button></form>';
  h+='<div class="opts">Tamanho <div class="seg" id="lenSeg">'+["curta","media","longa"].map(v=>'<button type="button" data-v="'+v+'" aria-pressed="'+(v===len)+'">'+{curta:"Curta",media:"Média",longa:"Longa"}[v]+'</button>').join("")+'</div></div>';
  h+='</section>';

  h+='<section aria-labelledby="secLidas"><h3 class="toc-sec" id="secLidas">Histórias do diário</h3>';
  if(!stories.length){
    h+='<p class="empty">Ainda não tem nenhuma história aqui. Escolha uma aí em cima para começar!</p>';
  }else{
    let month="";
    stories.slice().reverse().forEach(s=>{
      const m=new Date(s.at).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
      if(m!==month){month=m;h+='<div class="toc-month">'+esc(m)+'</div>'}
      h+='<button class="toc-row" data-id="'+s.id+'"><span class="d">'+esc(shortDate(s.at))+'</span><span class="t">'+esc(s.title)+'</span><span class="n">'+pageNo(s.id)+'</span></button>';
    });
  }
  h+='</section>';
  $("page").innerHTML=h;

  $("ideas").querySelectorAll(".idea").forEach(b=>b.onclick=()=>tell(its[Number(b.dataset.i)]));
  $("ownForm").addEventListener("submit",e=>{e.preventDefault();const v=$("ownTheme").value.trim();if(v)tell({title:cap(v),theme:v})});
  const seg=$("lenSeg");
  seg.onclick=e=>{const b=e.target.closest("button");if(!b)return;S.len=b.dataset.v;save("hb_set",S);seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  const gd=$("goDraft");if(gd)gd.onclick=()=>goTo(NOVA,1);
  $("page").querySelectorAll(".toc-row").forEach(b=>b.onclick=()=>goTo(b.dataset.id,1));
}

function renderStory(e){
  const latest=stories.length&&stories[stories.length-1].id===e.id;
  const tm=new Date(e.at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  let h=(latest?'<div class="ribbon" aria-hidden="true"></div>':'')+
    '<div class="p-head"><div class="p-date">'+esc(longDate(e.at))+'</div><div class="p-num">pág. '+pageNo(e.id)+'</div></div>'+
    photo(e.p||"tarde",e.season||"","")+
    '<h2 class="p-title">'+esc(e.title)+'</h2>'+
    '<div class="p-meta">contada às '+esc(tm)+'</div>'+
    (note&&noteFor===e.id?'<div class="status">'+esc(note)+'</div>':'')+
    '<div class="story">'+e.paras.map(p=>'<p>'+esc(p)+'</p>').join("")+'</div>'+
    '<div class="p-actions">'+
      ('speechSynthesis' in window?'<button class="link" id="speak">'+(speaking?"Parar":"Ouvir")+'</button>':'')+
      '<button class="link" id="toToc">Voltar ao sumário</button>'+
      '<button class="link'+(confirmDel?' warn':'')+'" id="del">'+(confirmDel?"Toque de novo para apagar":"Apagar esta história")+'</button>'+
    '</div>';
  $("page").innerHTML=h;
  if(noteFor===e.id){note="";noteFor=null}
  const sp=$("speak");if(sp)sp.onclick=toggleSpeak;
  $("toToc").onclick=()=>goTo(SUMARIO,-1);
  $("del").onclick=()=>{
    if(!confirmDel){confirmDel=true;render();return}
    confirmDel=false;stopSpeak();
    stories=stories.filter(s=>s.id!==e.id);save("oua_stories",stories);
    cur=SUMARIO;render();window.scrollTo({top:0});
  };
}

function renderDraft(){
  $("page").innerHTML='<div class="p-head"><div class="p-date">'+esc(longDate(Date.now()))+'</div><div class="p-num">nova página</div></div>'+
    photo(CTX.p,CTX.se.name,"")+
    '<h2 class="p-title" id="pTitle"></h2><div class="status" id="pStatus"></div><div class="story" id="pStory"></div>';

}

function photo(p,seasonName,caption,size){
  return '<figure class="photo s-'+p+(size?" "+size:"")+'" style="margin-inline:0">'+sceneSVG(p,seasonName)+(caption?'<figcaption>'+esc(caption)+'</figcaption>':'')+'</figure>';

/* ---------- Folhear ---------- */
let turning=false;
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function go(dir){
  if(turning)return;
  if(cur===CAPA){if(dir>0)openBook();return}
  const q=sequence(),j=q.indexOf(cur)+dir;
  if(j<0||j>=q.length)return;
  goTo(q[j],dir);
}
function goTo(k,dir){
  if(k===cur||turning)return;
  stopSpeak();confirmDel=false;
  if(cur===CAPA)markOpened();
  const pg=$("page");
  if(reduce){cur=k;render();window.scrollTo(0,0);return}
  turning=true;
  pg.classList.add(dir>0?"out-next":"out-prev");
  setTimeout(()=>{
    cur=k;render();window.scrollTo({top:0});
    pg.classList.remove("out-next","out-prev");
    pg.classList.add(dir>0?"in-next":"in-prev");
    setTimeout(()=>{pg.classList.remove("in-next","in-prev");turning=false},320);
  },250);
}
function openBook(){
  if(turning)return;
  markOpened();stopSpeak();
  const pg=$("page");
  if(reduce){cur=SUMARIO;render();window.scrollTo(0,0);return}
  turning=true;pg.classList.add("opening");
  setTimeout(()=>{
    cur=SUMARIO;render();window.scrollTo({top:0});
    pg.classList.remove("opening");pg.classList.add("in-next");
    setTimeout(()=>{pg.classList.remove("in-next");turning=false},320);
  },430);
}
$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("openToc").onclick=()=>{if(cur===CAPA)openBook();else goTo(SUMARIO,-1)};
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,dialog"))return;
  if(e.key==="ArrowLeft")go(-1);
  if(e.key==="ArrowRight")go(1);
});
let tx=null,ty=null;
$("book").addEventListener("touchstart",e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
$("book").addEventListener("touchend",e=>{
  if(tx===null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);
},{passive:true});
function openDlg(id){try{$(id).showModal()}catch(e){$(id).setAttribute("open","")}}
function closeDlg(id){try{$(id).close()}catch(e){$(id).removeAttribute("open")}}

/* ---------- Gerar história ---------- */
let ctrl=null;
const API="/api/historia";
function payload(it){
  const {p,se,dates,dow,dateStr,hh}=CTX;
  return {car:S.car,color:S.color,pers:S.pers,kid:S.kid,age:Number(S.age)||5,
    len:S.len||(p==="dormir"?"curta":"media"),bedtime:p==="dormir",
    agora:dow+", "+dateStr+", "+hh+" ("+PERIOD[p].label+"), "+se.name,
    datas:dates.map(d=>d.name+" ("+when(d.diff)+")").join(", "),
    theme:it.theme,titulo:it.fixedTitle?it.title:""};
}
function parse(text){
  const lines=text.replace(/\r/g,"").split("\n");
  let title="",start=0;
  const i=lines.findIndex(l=>/^\s*T[IÍ]TULO\s*:/i.test(l));
  if(i>=0){title=lines[i].replace(/^\s*T[IÍ]TULO\s*:\s*/i,"").replace(/\*+/g,"").trim();start=i+1}
  const paras=lines.slice(start).join("\n").trim().split(/\n\s*\n/).map(s=>s.replace(/\n/g," ").trim()).filter(Boolean);
  return{title,paras};
}
function paintDraft(){
  if(!draft||cur!==NOVA||!$("pStory"))return;
  $("pTitle").textContent=draft.title;
  $("pStatus").textContent=draft.status||"";
  $("pStory").innerHTML=(draft.paras.length?draft.paras:[""]).map((p,i,a)=>'<p'+(i===a.length-1?' class="caret"':'')+'>'+esc(p)+'</p>').join("");
}
async function tell(it){
  if(draft)return;
  buildContext();stopSpeak();markOpened();
  draft={title:it.title,paras:[],status:fill("O {car} está pensando numa história…"),theme:it.theme,p:CTX.p,season:CTX.se.name};
  goTo(NOVA,1);
  ctrl=new AbortController();
  try{
    const res=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload(it)),signal:ctrl.signal});
    if(!res.ok){let m="";try{m=(await res.json()).erro||""}catch(e){}throw {status:res.status,msg:m}}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf="",text="";
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith("data:"))continue;
        let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
        if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.text){
          text+=ev.delta.text;const r=parse(text);
          draft.title=r.title||it.title;draft.paras=r.paras;draft.status="";
          paintDraft();
        }else if(ev.type==="error")throw {status:500};
      }
    }
    const r=parse(text);if(!r.paras.length)throw {status:500};
    finish(r.title||it.title,r.paras,"");
  }catch(e){
    if(e&&e.name==="AbortError")return;
    const f=fallback();
    finish(f.title,f.paras,(e&&e.msg)?e.msg+" Enquanto isso, uma história do livrinho.":"Não deu para criar uma história nova agora. Esta é uma do livrinho.");
  }
}
function finish(title,paras,msg){
  const at=Date.now(),s={id:"h"+at,title,paras,at,p:draft.p,season:draft.season,theme:draft.theme};
  stories.push(s);save("oua_stories",stories);
  const wasReading=cur===NOVA;
  draft=null;
  if(msg){note=msg;noteFor=s.id}
  if(wasReading){cur=s.id;render()}
  else if(cur===SUMARIO&&!typing())render();
  else if(cur!==CAPA)render();
}

/* Histórias prontas (quando não dá para criar uma nova) */
function fallback(){
  const c=S.car,k=S.kid;
  if(CTX.p==="dormir")return{title:c+" conta as estrelas",paras:[
    "Era noite, e a rua estava quietinha. "+c+" entrou na garagem bem devagar, vrum… vrum… vruuum.",
    "Pela janela, ele viu uma estrela. \"Uma\", contou baixinho. Depois viu outra. \"Duas.\" E mais uma, piscando lá longe. \"Três.\"",
    (k?k+" estava ali do lado, de pijama, e ajudou a contar: quatro, cinco, seis…":"O vento passou de mansinho e ajudou a contar: quatro, cinco, seis…"),
    "A lua apareceu redonda e amarelinha e disse: \"Boa noite, "+c+".\" "+c+" piscou os faróis uma vez, bem fraquinho, para responder.",
    "Os olhos dele foram ficando pesados. Sete… oito… nov… "+c+" apagou os faróis, e a garagem ficou escurinha e quentinha.",
    "Ele não sentiu medo nenhum, porque lá fora as estrelas continuavam acesas, cuidando de todo mundo. Boa noite, "+c+". Boa noite"+(k?", "+k:"")+"."]};
  return{title:c+" e o amigo novo",paras:[
    "Numa manhã de sol, "+c+" buzinou bem alto: bi-bi! Era dia de passear pelo bairro.",
    "Na esquina, ele viu um carrinho pequeno, parado e quietinho. \"Oi! Eu sou o "+c+". Como você se chama?\" O carrinho respondeu baixinho: \"Tuco. Eu cheguei agora e não conheço ninguém.\"",
    c+" sorriu. \"Vem comigo! Eu te mostro a praça, a padaria e o morro onde a gente aposta corrida.\"",
    (k?k+" estava na praça e acenou: \"Oi, Tuco! Bem-vindo!\" ":"")+"Os dois rodaram juntos, e em cada lugar Tuco conhecia alguém novo.",
    "No fim da tarde, Tuco já buzinava sozinho: bi-bi! E "+c+" descobriu que fazer um amigo novo é uma das melhores aventuras que existem."]};
}

/* ---------- Ler em voz alta ---------- */
let speaking=false;
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false;const b=$("speak");if(b)b.textContent="Ouvir"}
function toggleSpeak(){
  if(speaking){stopSpeak();return}
  const e=storyById(cur);if(!e)return;
  try{
    const u=new SpeechSynthesisUtterance(e.title+". "+e.paras.join(" "));
    u.lang="pt-BR";u.rate=e.p==="dormir"?.82:.95;u.pitch=1.05;
    const v=speechSynthesis.getVoices().find(v=>/pt[-_]BR/i.test(v.lang));if(v)u.voice=v;
    u.onend=()=>{speaking=false;const b=$("speak");if(b)b.textContent="Ouvir"};
    speechSynthesis.speak(u);speaking=true;$("speak").textContent="Parar";
  }catch(err){const b=$("speak");if(b)b.hidden=true}
}

/* ---------- Ajustes ---------- */
let pickColor=S.color;
$("openSettings").onclick=()=>{
  $("sKid").value=S.kid;$("sAge").value=S.age;$("sCar").value=S.car;$("sBday").value=S.bday;$("sPers").value=S.pers;$("sBed").value=S.bed;
  pickColor=S.color;$("sColors").innerHTML="";
  Object.entries(COLORS).forEach(([n,c])=>{const b=document.createElement("button");b.type="button";b.style.background=c;b.setAttribute("aria-label",n);b.setAttribute("aria-pressed",n===pickColor);
    b.onclick=()=>{pickColor=n;[...$("sColors").children].forEach(x=>x.setAttribute("aria-pressed",x===b))};$("sColors").appendChild(b)});
  openDlg("settings");
};
$("saveSet").onclick=()=>{
  S.kid=$("sKid").value.trim();S.age=Number($("sAge").value)||5;S.car=$("sCar").value.trim()||"Biju";
  S.bday=$("sBday").value.trim();S.pers=$("sPers").value.trim()||DEF.pers;S.bed=$("sBed").value||"19:30";S.color=pickColor;
  save("hb_set",S);render();
};

  installEvt.prompt();
  try{await installEvt.userChoice}catch(e){}
  installEvt=null;$("installBtn").hidden=true;
};

render();
// Atualiza as sugestões do sumário quando o momento do dia muda
let lastSig="";
setInterval(()=>{
  if(cur!==SUMARIO||draft||typing())return;
  buildContext();const sig=ideas().map(t=>t.title).join("|")+CTX.p;
  if(lastSig&&sig!==lastSig)render();
  lastSig=sig;
},60000);
})();

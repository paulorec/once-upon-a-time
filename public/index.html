<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Once Upon a Time</title>
<meta name="description" content="Diário de histórias infantis com o Biju, um carrinho curioso e corajoso.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#a8471f">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Once Upon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: um diário aberto sobre a mesa. Cada dia é uma página pautada; folheia-se com setas, gestos ou pelo sumário. */
:root{
  --desk:#e6e1ee; --paper:#fffdf7; --paper-edge:#efe9dc; --rule:#dbe5f1; --rule-soft:#f1f4f9; --margin:#f0a9a9;
  --ink:#2d2a3e; --pencil:#77718a; --chip:#f3eee3; --night:#24305e;
  --accent:#ff7a3d; --accent-ink:#ffffff; --car:#ff7a3d; --cover:#a8471f;
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --sky1:#9fd8f5; --sky2:#e6f6ff; --hill1:#8fcf7a; --hill2:#6bb862; --road:#5d5a6b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101226; --paper:#1d2136; --paper-edge:#161a2c; --rule:#2a3150; --rule-soft:#222740; --margin:#6e3a50;
  --ink:#eeeaf7; --pencil:#a7a2bd; --chip:#2a2f4a; --accent-ink:#1d2136; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#101226; --paper:#1d2136; --paper-edge:#161a2c; --rule:#2a3150; --rule-soft:#222740; --margin:#6e3a50;
  --ink:#eeeaf7; --pencil:#a7a2bd; --chip:#2a2f4a; --accent-ink:#1d2136; color-scheme:dark}

.s-manha{--sky1:#9fd8f5;--sky2:#fff3d6;--hill1:#9bd884;--hill2:#6bb862;--road:#5d5a6b}
.s-tarde{--sky1:#6ec3f0;--sky2:#d6f0ff;--hill1:#8fcf7a;--hill2:#5fae58;--road:#5d5a6b}
.s-entardecer{--sky1:#f6a26b;--sky2:#ffd9a0;--hill1:#7aa86a;--hill2:#5b8a55;--road:#5d5a6b}
.s-dormir{--sky1:#141a3d;--sky2:#2c3a78;--hill1:#2c4a4a;--hill2:#1f3838;--road:#3a3850}

*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--hand);font-size:17px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 28px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}

.shell{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:4px}
.top h1{font-size:1.45rem;line-height:1.1}
.top h1 small{display:block;font-size:.95rem;color:var(--pencil)}
.top-actions{display:flex;gap:6px}
.pill{border:0;background:var(--paper);border-radius:999px;padding:7px 14px;font-size:1rem;box-shadow:0 1px 0 var(--paper-edge),0 2px 6px rgba(0,0,0,.08)}

/* O livro */
.book{position:relative;perspective:1400px}
.page{position:relative;background:var(--paper);border-radius:6px 16px 16px 6px;min-height:72vh;
  padding:22px 18px 30px 46px;
  box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.28),0 1px 0 var(--paper-edge),0 3px 0 var(--paper-edge),0 5px 0 var(--paper-edge),0 12px 28px rgba(20,16,50,.16);
  background-image:linear-gradient(transparent 0 calc(2rem - 1px),var(--rule) calc(2rem - 1px) 2rem);
  background-size:100% 2rem;background-position:0 1.2rem;
  transform-origin:left center;}
.page::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:var(--margin);opacity:.8}
.page>*{position:relative}
.ribbon{position:absolute;top:-6px;right:26px;width:18px;height:58px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.9}

.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;padding-right:30px}
.p-date{font-size:1.35rem;line-height:1.2}
.p-num{color:var(--pencil);font-size:.95rem;white-space:nowrap}

.photo{background:#fff;padding:8px 8px 10px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.18);transform:rotate(-1.3deg);margin:4px 4px 18px;position:relative;line-height:0;max-width:100%}
.photo svg{width:100%;height:auto;display:block;border-radius:2px}
.photo::before,.photo::after{content:"";position:absolute;width:62px;height:20px;background:var(--car);opacity:.45;top:-8px}
.photo::before{left:-10px;transform:rotate(-24deg)}
.photo::after{right:-10px;transform:rotate(22deg)}
.photo figcaption{line-height:1.25;font-size:1rem;color:#4a4560;padding:8px 4px 0}

.p-title{font-size:1.75rem;line-height:1.15;margin:6px 0 4px}
.p-meta{color:var(--pencil);font-size:1rem;margin-bottom:8px}
.story{font-family:var(--read);font-size:1.08rem;line-height:2rem;max-width:62ch}
.story p{margin:0 0 2rem}
.caret::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.status{color:var(--pencil);font-size:1rem;margin:4px 0 10px}
.p-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.link{border:0;background:var(--chip);border-radius:999px;padding:6px 14px;font-size:1rem}
.link.warn{background:var(--accent);color:var(--accent-ink)}

/* Página de hoje, ainda em branco */
.prompt{font-size:1.6rem;line-height:1.2;margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--chip);border-radius:999px;padding:3px 11px;font-size:.98rem}
.chip.hot{background:var(--accent);color:var(--accent-ink)}
.bedtime{background:var(--night);color:#f1edf9;border-radius:12px;padding:10px 14px;font-size:1.05rem;line-height:1.35;margin-bottom:14px}
.ideas{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:4px}
.idea{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:2px 10px;padding:6px 6px;border-radius:10px;width:100%}
.idea:hover{background:var(--chip)}
.idea:focus-visible{outline:3px solid var(--accent)}
.idea .dot{width:16px;height:16px;border:2px solid var(--pencil);border-radius:50%;margin-top:6px;grid-row:span 2}
.idea:hover .dot{border-color:var(--accent);background:var(--accent)}
.idea b{font-weight:400;font-size:1.22rem;line-height:1.3;min-width:0}
.idea span{font-family:var(--read);font-size:.92rem;color:var(--pencil);line-height:1.5;min-width:0}
.own{display:flex;gap:8px;margin-bottom:12px}
.own input{flex:1;min-width:0;border:0;border-bottom:2px dashed var(--pencil);background:transparent;color:var(--ink);font:inherit;font-size:1.15rem;padding:6px 2px}
.own input::placeholder{color:var(--pencil);opacity:.8}
.go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 16px;font-size:1.1rem}
.opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--pencil)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:3px 12px;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Navegação */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-inline:4px}
.nav button{border:0;background:var(--paper);border-radius:12px;padding:9px 12px;font-size:1.05rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .next{justify-self:end}
.nav .prev{justify-self:start}
.nav .where{color:var(--pencil);font-size:1rem;text-align:center}
.hint{text-align:center;color:var(--pencil);font-size:.92rem}

/* Folhear */
.out-next{animation:outNext .26s ease-in forwards}
.out-prev{animation:outPrev .26s ease-in forwards}
.in-next{animation:inNext .3s ease-out}
.in-prev{animation:inPrev .3s ease-out}
@keyframes outNext{to{transform:rotateY(-24deg) translateX(-10%);opacity:0}}
@keyframes outPrev{to{transform:rotateY(18deg) translateX(10%);opacity:0}}
@keyframes inNext{from{transform:rotateY(18deg) translateX(10%);opacity:0}}
@keyframes inPrev{from{transform:rotateY(-24deg) translateX(-10%);opacity:0}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.out-next,.out-prev,.in-next,.in-prev,.bob,.caret::after{animation:none}}

/* ---------- Cenas vivas ---------- */
.roda,.olhos,.sol-brilho,.pers .corpo,.farol{transform-box:fill-box;transform-origin:center}
.roda{animation:gira 1.4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.pers .corpo{animation:anda 1.8s ease-in-out infinite}
@keyframes anda{50%{transform:translateY(-1.5px)}}
.olhos{animation:pisca 5.2s infinite}
@keyframes pisca{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
.p-tuco .olhos{animation-delay:-1.1s}.p-pipoca .olhos{animation-delay:-2.3s;animation-duration:3.8s}.p-tonho .olhos{animation-delay:-3.4s;animation-duration:6.5s}
.p-vania .olhos{animation-delay:-.6s}.p-rubi .olhos{animation-delay:-4.1s}.p-lama .olhos{animation-delay:-2.9s}.p-ze .olhos{animation-delay:-1.7s;animation-duration:7s}
.p-pipoca .corpo{animation-duration:1.1s}.p-tonho .corpo,.p-ze .corpo{animation-duration:2.6s}
.nuvens{animation:nuvem 16s ease-in-out infinite alternate}
@keyframes nuvem{to{transform:translateX(34px)}}
.sol-brilho{animation:solpulsa 4s ease-in-out infinite}
@keyframes solpulsa{50%{transform:scale(1.15)}}
.brilho{animation:brilha 2.6s ease-in-out infinite}
@keyframes brilha{50%{opacity:.15}}
.ondas{animation:onda 3s linear infinite}
@keyframes onda{to{transform:translateX(40px)}}
.gotas{animation:chove .55s linear infinite}
@keyframes chove{from{transform:translate(4px,-14px)}to{transform:translate(-4px,14px)}}
.bandeiras{transform-box:fill-box;transform-origin:50% 0;animation:balancar 3.2s ease-in-out infinite}
@keyframes balancar{50%{transform:rotate(1.4deg)}}
.balao{animation:flutua 3s ease-in-out infinite alternate}
@keyframes flutua{to{transform:translateY(-7px)}}
.fumaca circle{transform-box:fill-box;transform-origin:center;animation:fuma 2.6s ease-out infinite}
.fumaca circle+circle{animation-delay:-1.3s}
@keyframes fuma{from{transform:translate(0,0) scale(.7);opacity:.85}to{transform:translate(10px,-22px) scale(1.4);opacity:0}}
.farol{animation:farol 1.6s ease-in-out infinite}
@keyframes farol{50%{opacity:.25}}
.zzz text{animation:zzz 3.2s ease-in-out infinite}
.zzz text+text{animation-delay:-1.6s}
@keyframes zzz{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-12px);opacity:0}}
/* Na hora de dormir: tudo estacionado e mais lento */
.s-dormir .roda,.s-dormir .pers .corpo{animation:none}
.s-dormir .olhos{animation:none}
.s-dormir .nuvens{animation-duration:30s}

/* ---------- Toque e brincadeira ---------- */
.pers,.sol,.lua{cursor:pointer}
.pers.pula .corpo{animation:pula .7s ease-out}
@keyframes pula{30%{transform:translateY(-24px)}55%{transform:translateY(0)}70%{transform:translateY(-7px)}85%{transform:translateY(0)}}
.pers.timido .corpo{animation:timido 1s ease-in-out}
@keyframes timido{30%,70%{transform:scale(.88) translateX(-4px)}}
.pers.empina .corpo{transform-origin:20% 100%;animation:empina 1s ease-in-out}
@keyframes empina{25%,60%{transform:rotate(-16deg)}}
.pers.acena .corpo{transform-origin:50% 100%;animation:acena 1.1s ease-in-out}
@keyframes acena{25%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}}
.pers.rebola .corpo{transform-origin:50% 100%;animation:rebola .9s ease-in-out}
@keyframes rebola{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.pers.treme .corpo{animation:treme .6s linear}
@keyframes treme{10%,50%,90%{transform:translate(-3px,-2px)}30%,70%{transform:translate(3px,1px)}}
.pers.sonolento .corpo{animation:sonolento 1.4s ease-in-out}
@keyframes sonolento{50%{transform:translateY(2px) scaleY(.97)}}
.sirene-on .sirene{animation:sirene .3s steps(2) 8}
@keyframes sirene{50%{fill:#3d7cff}}
.fuma-forte .fumaca circle{animation-duration:.7s}
.mostra-arco .surpresa-arco{animation:aparece 3.6s ease forwards}
@keyframes aparece{15%,75%{opacity:.75}100%{opacity:0}}
.mostra-estrela .surpresa-estrela{animation:cadente 1.6s ease-out forwards}
@keyframes cadente{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(150px,60px)}}
.sol.gira-sol{transform-box:fill-box;transform-origin:center;animation:solgira 1s ease-in-out}
@keyframes solgira{50%{transform:scale(1.25) rotate(20deg)}}
.balao-fala{position:absolute;z-index:3;transform:translate(-50%,-100%);background:#fff;color:#2d2a3e;border-radius:14px;padding:3px 12px;font-family:var(--hand);font-size:1.15rem;line-height:1.3;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none;animation:fala 1.8s ease forwards}
.balao-fala::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes fala{0%{opacity:0;margin-top:6px}12%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-6px}}
.dica{font-size:1rem;color:var(--pencil);margin:-10px 0 12px}
.retrato,.oval{position:relative}
.oval{overflow:visible}
.oval svg{border-radius:50%}
@media (prefers-reduced-motion:reduce){svg *,.pers .corpo,.balao-fala{animation:none!important}}

/* Sumário e ajustes */
dialog{border:0;border-radius:16px;background:var(--paper);color:var(--ink);width:min(520px,calc(100vw - 28px));max-height:84vh;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(16,14,40,.45)}
.toc h2,.form h2{font-size:1.6rem;margin-bottom:6px}
.toc-month{color:var(--pencil);font-size:1.05rem;margin:12px 0 2px;text-transform:capitalize}
.toc-item{all:unset;cursor:pointer;display:grid;grid-template-columns:3.2rem 1fr;gap:10px;padding:6px 4px;border-bottom:1px dashed var(--rule);width:100%;box-sizing:border-box}
.toc-item:focus-visible{outline:3px solid var(--accent)}
.toc-item .d{color:var(--pencil)}
.toc-item .t{font-size:1.15rem;min-width:0}
.toc-item.current .t{color:var(--accent)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:1.05rem}
.form input,.form textarea{border:2px solid var(--rule);background:transparent;color:var(--ink);border-radius:10px;padding:8px 10px;font-family:var(--read);font-size:.95rem}
.form textarea{min-height:70px;resize:vertical}
.colors{display:flex;gap:10px}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-actions{display:flex;gap:8px;justify-content:flex-end}

/* Página de leitura: pautas bem clarinhas para não atrapalhar */
.page.leitura{background-image:linear-gradient(transparent 0 calc(2rem - 1px),var(--rule-soft) calc(2rem - 1px) 2rem)}
.page.leitura::before{opacity:.3}

/* Sumário */
.toc-title{font-size:2.2rem;line-height:1.1}
.toc-sec{font-size:1.35rem;color:var(--accent);margin:10px 0 8px}
section+section{margin-top:22px}
.photo.small{max-width:340px}
.empty{font-family:var(--read);color:var(--pencil);font-size:.98rem;line-height:2rem;margin:0}
.toc-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:3.6rem 1fr auto;align-items:baseline;gap:8px;width:100%;padding:4px 4px;border-radius:8px;min-height:2rem}
.toc-row:hover{background:var(--chip)}
.toc-row:focus-visible{outline:3px solid var(--accent)}
.toc-row .d{color:var(--pencil);font-size:1rem}
.toc-row .t{display:flex;align-items:baseline;gap:6px;font-size:1.2rem;line-height:1.3;min-width:0}
.toc-row .t::after{content:"";flex:1;min-width:16px;border-bottom:2px dotted var(--pencil);opacity:.55;transform:translateY(-4px)}
.toc-row .n{color:var(--pencil);font-size:1.05rem;font-variant-numeric:tabular-nums}

.ideas li.lida .dot{background:var(--accent);border-color:var(--accent)}
.ideas li.lida b{opacity:.75}
.nova-versao{border:0;background:none;color:var(--accent);font-size:.98rem;padding:0 0 4px 38px;text-decoration:underline;text-underline-offset:3px}

.entra{animation:entra .7s ease}
@keyframes entra{from{opacity:0;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){.entra{animation:none}}

/* Apresentação (primeira vez) */
#onboard{position:fixed;inset:0;z-index:30;background:var(--desk);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.ob{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ob .page{min-height:auto;display:flex;flex-direction:column;gap:16px}
.ob-pontos{display:flex;gap:8px;justify-content:center}
.ob-pontos i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.ob-pontos i.on{background:var(--accent);width:22px;border-radius:5px}
.ob h2{font-size:2rem;line-height:1.1}
.ob p{font-family:var(--read);line-height:2rem;margin:0}
.ob .nota{font-size:.9rem;color:var(--pencil);line-height:1.5}
.ob-campo{display:grid;gap:6px;font-size:1.15rem}
.ob-campo input{border:0;border-bottom:2px dashed var(--pencil);background:transparent;color:var(--ink);font-family:var(--hand);font-size:1.6rem;padding:4px 2px}
.ob-campo input[type=time]{font-size:1.4rem;max-width:10rem}
.ob-chips{display:flex;flex-wrap:wrap;gap:8px}
.ob-chips button{border:2px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 14px;font-size:1.1rem}
.ob-chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ob-retrato{background:#fff;padding:6px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.18);line-height:0;transform:rotate(-1.2deg);max-width:340px;align-self:center;width:100%}
.ob-retrato svg{width:100%;height:auto}
.ob-acoes{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ob-acoes .go{font-size:1.25rem;padding:10px 22px}
.ob-pular{border:0;background:none;color:var(--pencil);font-size:1.05rem;text-decoration:underline;text-underline-offset:3px}
.ob-linha{display:flex;gap:12px;flex-wrap:wrap}
.ob-linha .ob-campo{flex:1;min-width:8rem}

/* Convite para instalar */
.convite{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0 auto;max-width:560px;display:flex;gap:12px;align-items:flex-start;
  background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(20,16,50,.22);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  animation:sobeConvite .45s ease}
@keyframes sobeConvite{from{transform:translateY(100%)}}
.convite-mini{width:96px;flex:none;line-height:0;background:#fff;padding:4px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.15);transform:rotate(-2deg)}
.convite-mini svg{width:100%;height:auto}
.convite-texto{display:grid;gap:6px;min-width:0}
.convite-texto b{font-weight:400;font-size:1.3rem;line-height:1.15}
.convite-texto p{margin:0;font-family:var(--read);font-size:.95rem;line-height:1.5}
.convite-texto .ic,.ob .ic{vertical-align:-4px;color:var(--accent)}
.convite-acoes{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
@media (prefers-reduced-motion:reduce){.convite{animation:none}}

/* A turma */
.turma-intro{font-family:var(--read);color:var(--pencil);margin:0 0 14px;line-height:2rem}
.turma{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:520px){.turma{grid-template-columns:1fr 1fr}}
.membro{margin:0;display:grid;gap:8px;align-content:start;min-width:0}
.retrato{background:#fff;padding:6px 6px 8px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.18);line-height:0;position:relative}
.retrato::before{content:"";position:absolute;width:54px;height:16px;background:var(--car);opacity:.45;top:-7px;left:50%;margin-left:-27px;transform:rotate(-3deg)}
.retrato svg{width:100%;height:auto;display:block}
.membro figcaption{display:grid;gap:2px;min-width:0}
.membro b{font-weight:400;font-size:1.5rem;line-height:1.1}
.membro .tipo{color:var(--pencil);font-size:1rem}
.membro .jeito{font-family:var(--read);font-size:.92rem;line-height:1.55}
.membro{cursor:pointer;border-radius:8px;transition:transform .2s}
.membro:hover .retrato{box-shadow:0 4px 14px rgba(0,0,0,.25)}
.membro:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.membro.escolhido{transform:scale(.97)}
.membro .ler{color:var(--accent);font-size:1.1rem;margin-top:2px}
.membro .conta{justify-self:start;background:var(--chip);border-radius:999px;padding:1px 10px;font-size:.95rem;margin-top:4px}

/* Capa */
.page.cover{background-color:var(--cover);color:#f7efdf;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px),radial-gradient(rgba(0,0,0,.10) 1px,transparent 1.5px);
  background-size:5px 5px,7px 7px;background-position:0 0,2px 3px;
  padding:40px 58px 34px 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  border-radius:8px 18px 18px 8px;
  box-shadow:inset 20px 0 22px -12px rgba(0,0,0,.5),inset 3px 0 0 rgba(0,0,0,.25),0 1px 0 #e8e1d3,0 3px 0 #ddd5c4,0 5px 0 #d2c9b6,0 14px 30px rgba(20,16,50,.3)}
.page.cover::before{left:18px;right:14px;top:14px;bottom:14px;width:auto;background:none;opacity:1;border:2px dashed rgba(247,239,223,.4);border-radius:6px 12px 12px 6px}
.strap{position:absolute;top:0;bottom:0;right:24px;width:16px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.3) 40%,rgba(255,255,255,.12) 50%,rgba(0,0,0,.35));box-shadow:0 0 6px rgba(0,0,0,.35)}
.corner{position:absolute;right:0;width:30px;height:30px;background:linear-gradient(135deg,#efe0b4,#b99a55)}
.corner.t{top:0;border-top-right-radius:18px;clip-path:polygon(0 0,100% 0,100% 100%)}
.corner.b{bottom:0;border-bottom-right-radius:18px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.emboss{font-size:1rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,239,223,.78)}
.cover-title{font-size:2.7rem;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35),0 -1px 0 rgba(255,255,255,.18)}
.oval{width:min(240px,100%);aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid #f7efdf;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.35);line-height:0}
.oval svg{width:100%;height:100%;display:block}
.plate{background:#fbf6ea;color:#2d2a3e;padding:10px 22px 12px;border-radius:8px;box-shadow:inset 0 0 0 2px #e2d8c3,inset 0 0 0 5px #fbf6ea,inset 0 0 0 6px #e2d8c3,0 3px 6px rgba(0,0,0,.35);max-width:100%}
.plate small{display:block;font-size:1rem;color:#6d6880}
.plate strong{display:block;font-weight:400;font-size:2rem;line-height:1.1;overflow-wrap:anywhere}
.cover-meta{font-size:1.05rem;color:rgba(247,239,223,.85)}
.open{border:0;background:#f7efdf;color:var(--cover);border-radius:999px;padding:10px 24px;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.open:hover{transform:translateY(-1px)}
.opening{animation:openCover .45s ease-in forwards}
@keyframes openCover{to{transform:rotateY(-100deg);opacity:.15}}
@media (prefers-reduced-motion:reduce){.opening{animation:none}}

@media (max-width:420px){.page{padding-left:40px;padding-right:14px}.page::before{left:28px}.p-title{font-size:1.55rem}
  .page.cover{padding:36px 50px 30px 36px}.cover-title{font-size:2.3rem}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1 id="bookTitle">Diário de histórias<small id="bookSub">Once Upon a Time</small></h1>
    <div class="top-actions">
      <button class="pill" id="installBtn" hidden>Instalar</button>
      <button class="pill" id="openToc">Sumário</button>
      <button class="pill" id="openSettings">Ajustes</button>
    </div>
  </header>

  <div class="book" id="book">
    <article class="page" id="page" aria-live="polite"></article>
  </div>

  <nav class="nav" aria-label="Folhear o diário">
    <button class="prev" id="prev">‹ Dia anterior</button>
    <div class="where" id="where"></div>
    <button class="next" id="next">Próximo dia ›</button>
  </nav>
  <div class="hint">Arraste a página para os lados para folhear</div>
</div>

<div id="onboard" hidden></div>
<aside class="convite" id="convite" hidden aria-live="polite"></aside>

<dialog id="settings">
  <form class="form" method="dialog">
    <h2>Ajustes</h2>
    <div class="row2">
      <label>Nome da criança<input id="sKid" placeholder="Ex.: Lia"></label>
      <label>Idade<input id="sAge" type="number" min="1" max="12" placeholder="5"></label>
    </div>
    <div class="row2">
      <label>Nome do carrinho<input id="sCar"></label>
      <label>Aniversário (dd/mm)<input id="sBday" placeholder="Ex.: 03/05"></label>
    </div>
    <label>Cor do carrinho<div class="colors" id="sColors"></div></label>
    <label>Jeitinho do carrinho<textarea id="sPers"></textarea></label>
    <label>Hora de dormir<input id="sBed" type="time"></label>
    <label style="display:flex;align-items:center;gap:10px"><input id="sSom" type="checkbox" style="width:22px;height:22px"> Sons quando tocar nos personagens</label>
    <button class="link" type="button" id="refazerOnb" style="justify-self:start">Refazer a apresentação</button>
    <div class="d-actions">
      <button class="link" value="cancel">Cancelar</button>
      <button class="go" id="saveSet" value="ok">Salvar</button>
    </div>
  </form>
</dialog>

<script src="/arte.js"></script>
<script>
(function(){
const COLORS={laranja:"#ff7a3d",turquesa:"#1fb5a8",vermelho:"#e84855",amarelo:"#f5b700",azul:"#3d7cff"};
const COVERS={laranja:"#a8471f",turquesa:"#12645f",vermelho:"#8c2232",amarelo:"#8f6200",azul:"#22438c"};
const DEF={kid:"",age:5,car:"Biju",color:"laranja",bday:"",bed:"19:30",som:true,
  pers:"curioso e corajoso, adora fazer amigos pelo caminho, buzina \"bi-bi!\" quando fica feliz e tem um pouquinho de medo do escuro, mas acende os faróis e segue em frente",len:""};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=Object.assign({},DEF,load("hb_set",{}));
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fill(t){return t.replace(/\{car\}/g,S.car)}

/* ---------- Histórias do diário ---------- */
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateOfKey(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
let stories=load("oua_stories",null);
if(!stories){ // traz as histórias das versões anteriores
  stories=[];
  const old=load("oua_days",null);
  if(old)Object.keys(old).forEach(k=>{const e=old[k];if(e&&e.paras)stories.push(Object.assign({},e,{at:e.at||dateOfKey(k).getTime()}))});
  else load("hb_hist",[]).forEach(h=>{if(h&&h.at&&h.paras)stories.push({title:h.title,paras:h.paras,at:h.at,p:"tarde",season:season(new Date(h.at)).name})});
  stories.forEach(s=>{s.id="h"+s.at});
  save("oua_stories",stories);
}
stories.sort((a,b)=>a.at-b.at);
// Cache: cada sugestão ou tema vira uma chave; história já contada abre direto, sem chamar a IA.
function normaliza(t){return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function chaveDe(it){return it.fixedTitle?"t:"+normaliza(it.title):"m:"+normaliza(it.theme)}
function jaContada(chave){for(let i=stories.length-1;i>=0;i--){const s=stories[i];if(s.chave===chave&&!s.livrinho)return s}return null}
(function limparRepetidas(){ // tira cópias idênticas (mesmo título e mesmo texto), mantendo a primeira
  const vistas=new Set(),antes=stories.length;
  stories=stories.filter(s=>{const k=normaliza(s.title)+"|"+normaliza((s.paras||[]).join(" "));if(vistas.has(k))return false;vistas.add(k);return true});
  if(stories.length!==antes)save("oua_stories",stories);
})();
function storyById(id){return stories.find(s=>s.id===id)}
const CAPA="capa",SUMARIO="sumario",TURMA="turma",NOVA="nova";
function recentlyOpened(){try{return Date.now()-Number(sessionStorage.getItem("oua_open")||0)<30*60*1000}catch(e){return false}}
function markOpened(){try{sessionStorage.setItem("oua_open",String(Date.now()))}catch(e){}}
let cur=recentlyOpened()?SUMARIO:CAPA;
let draft=null;   // história sendo escrita agora
function sequence(){const q=[CAPA,SUMARIO,TURMA,...stories.map(s=>s.id)];if(draft)q.push(NOVA);return q}

/* ---------- Data e contexto ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function nthSunday(y,m,n){const d=new Date(y,m,1);const off=(7-d.getDay())%7;return new Date(y,m,1+off+7*(n-1))}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function specialDates(y){
  const E=easter(y);
  // [data, nome (só interno), tema enviado à IA, título visível, chamada visível]
  const L=[
    [new Date(y,0,1),"Ano Novo","um começo de ano cheio de desejos bons, fogos coloridos no céu e promessas de aventura","{car} e o céu que virou festa","Uma noite em que o céu inteiro brilhou de mil cores.",{cena:"cidade",rosto:"rindo",acessorio:"festa"}],
    [addDays(E,-47),"Carnaval","um desfile de carnaval com fantasias, confete, frevo e marchinhas pela cidade","{car} e a fantasia mais colorida da rua","Confete, música e uma fantasia que ninguém esperava.",{cena:"festa",rosto:"rindo",acessorio:"festa",amigos:["pipoca"]}],
    [E,"Páscoa","uma caça aos ovos de chocolate escondidos pela cidade e o valor de dividir com os amigos","{car} e os ovinhos escondidos","Uma trilha de surpresas espalhadas pela cidade.",{cena:"campo",rosto:"surpreso",acessorio:"flor",amigos:["tuco"]}],
    [new Date(y,3,18),"Dia do Livro Infantil","uma biblioteca mágica onde as histórias saem dos livros","{car} e o livro que falava","Uma biblioteca onde as histórias pulam das páginas.",{cena:"escola",rosto:"pensativo",amigos:["bilu"]}],
    [new Date(y,3,19),"Dia dos Povos Indígenas","uma visita a uma aldeia onde aprende sobre a floresta, os rios e as histórias dos povos indígenas","{car} e os guardiões da floresta","Uma viagem até onde o rio canta e as árvores contam histórias.",{cena:"floresta",amigos:["lama"]}],
    [new Date(y,3,22),"Dia da Terra","cuidar do planeta: plantar, economizar água e limpar a praça","{car} e a praça que pediu ajuda","Uma missão para deixar tudo verdinho de novo.",{cena:"campo",amigos:["lili"]}],
    [nthSunday(y,4,2),"Dia das Mães","preparar uma surpresa carinhosa para a mamãe","{car} e a surpresa da mamãe","Um segredo muito carinhoso sendo preparado.",{cena:"campo",acessorio:"flor"}],
    [new Date(y,5,5),"Dia do Meio Ambiente","salvar um rio cheio de lixo com a ajuda dos amigos","{car} e o rio que queria brilhar","Uma missão com os amigos para salvar um rio.",{cena:"floresta",rosto:"corajoso",amigos:["crocomilha"]}],
    [new Date(y,5,24),"São João","uma festa junina com fogueira, quadrilha, milho assado, bandeirinhas e forró","{car} e a fogueira das estrelinhas","Bandeirinhas, milho assado e uma dança animada.",{cena:"festa",acessorio:"palha",amigos:["ze"]}],
    [new Date(y,6,26),"Dia dos Avós","um passeio com os avós e as histórias de quando eles eram pequenos","{car} e o vovô caminhãozinho","Um passeio cheio de histórias de antigamente.",{cena:"campo",amigos:["tonho"]}],
    [nthSunday(y,7,2),"Dia dos Pais","uma aventura com o papai e um presente feito à mão","{car} e o presente feito à mão","Um dia de aventura com o papai.",{cena:"cidade",rosto:"rindo"}],
    [new Date(y,7,22),"Dia do Folclore","um encontro com personagens do folclore brasileiro, como a Iara e o Curupira, de um jeito amigável","{car} e o mistério da mata","Uns amigos muito diferentes aparecem na floresta.",{cena:"floresta",rosto:"surpreso",amigos:["lama"]}],
    [new Date(y,8,7),"Independência","um desfile com bandeirinhas verdes e amarelas","{car} e o desfile verde e amarelo","Bandeirinhas, banda e um desfile pela avenida.",{cena:"cidade",acessorio:"festa",amigos:["rubi"]}],
    [new Date(y,8,21),"Dia da Árvore","uma árvore muito velha e sábia que precisa de ajuda","{car} e a árvore mais velha do mundo","Uma árvore sábia que guarda um segredo.",{cena:"floresta",rosto:"pensativo",amigos:["ze"]}],
    [new Date(y,9,12),"Dia das Crianças","uma grande festa com brincadeiras, pipas e muitas risadas","{car} e a festa das pipas","Um dia inteirinho de brincadeiras e risadas.",{cena:"festa",rosto:"rindo",acessorio:"festa",amigos:["pipoca","tuco"]}],
    [new Date(y,9,15),"Dia do Professor","uma escola de carrinhos e uma professora muito querida e divertida","{car} e a sua professora engraçada","Na escola dos carrinhos, todo dia tem uma surpresa.",{cena:"escola",rosto:"rindo",amigos:["vania"]}],
    [new Date(y,9,31),"Dia do Saci","um redemoinho travesso e o Saci, que esconde coisas mas no fim vira amigo","{car} e o redemoinho travesso","Alguém anda escondendo as coisas da garagem…",{cena:"floresta",rosto:"surpreso",amigos:["matinto"]}],
    [new Date(y,10,20),"Consciência Negra","uma roda de capoeira, música e as histórias de heróis e heroínas negros do Brasil","{car} e a roda de capoeira","Música, ginga e histórias de grandes heróis.",{cena:"festa",rosto:"rindo",amigos:["tuco"]}],
    [new Date(y,11,25),"Natal","uma noite de Natal com luzinhas, presentes e o Papai Noel precisando de uma carona","{car} e a carona mais especial do ano","Uma noite de luzinhas e um pedido muito especial.",{cena:"cidade",acessorio:"gorro",amigos:["rubi"]}],
    [new Date(y,11,31),"Réveillon","esperar a virada do ano na praia, vestido de branco, vendo os fogos","{car} e a contagem até a meia-noite","Todo mundo na praia, esperando o céu se acender.",{cena:"praia",rosto:"rindo",amigos:["pipoca"]}]
  ];
  if(S.bday&&/^\d{1,2}\/\d{1,2}$/.test(S.bday)){const[d,m]=S.bday.split("/").map(Number);
    L.push([new Date(y,m-1,d),"Aniversário"+(S.kid?" de "+S.kid:""),"uma festa de aniversário surpresa"+(S.kid?" para "+S.kid:"")+", com bolo, balões e amigos","{car} e a festa surpresa","Balões, bolo e um segredo muito bem guardado.",{cena:"festa",acessorio:"festa",amigos:["pipoca","tuco"]}]);}
  return L.map(([date,name,theme,title,teaser,art])=>({date,name,theme,title,teaser,art}));
}
function nearbyDates(now){
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const all=[...specialDates(t.getFullYear()-1),...specialDates(t.getFullYear()),...specialDates(t.getFullYear()+1)];
  return all.map(s=>({...s,diff:Math.round((s.date-t)/864e5)})).filter(s=>s.diff>=-5&&s.diff<=15).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff));
}
function season(now){
  const md=now.getMonth()*100+now.getDate();
  if(md>=822&&md<1121)return{name:"primavera",theme:"a primavera chegando, flores abrindo e borboletas pelo caminho"};
  if(md>=1121||md<220)return{name:"verão",theme:"um dia de verão bem quente, praia, picolé e água de coco"};
  if(md>=220&&md<520)return{name:"outono",theme:"o outono, com ventinho fresco, folhas e pipas no céu"};
  return{name:"inverno",theme:"a época de chuva, com poças para pular, guarda-chuvas e arco-íris"};
}
function bedMinutes(){const[h,m]=(S.bed||"19:30").split(":").map(Number);return h*60+(m||0)}
function period(now){
  const mins=now.getHours()*60+now.getMinutes(),bed=bedMinutes();
  if(mins>=bed||mins<5*60)return"dormir";
  if(mins>=bed-60)return"entardecer";
  if(mins<12*60)return"manha";
  if(mins<17*60+30)return"tarde";
  return"entardecer";
}
const PERIOD={
  manha:{label:"manhã",hello:"Bom dia! O {car} já acordou com o tanque cheio de energia.",idea:["{car} e o café da manhã no posto","Um passeio cedinho para ver o sol acordar a cidade, cumprimentando todo mundo pelo caminho."],theme:"uma manhã animada, café da manhã e um dia começando"},
  tarde:{label:"tarde",hello:"Boa tarde! O {car} está pronto para uma aventura.",idea:["{car} e o mapa do tesouro","Uma tarde de aventura atrás de um tesouro escondido no parque."],theme:"uma aventura à tarde, com um mapa e um mistério divertido"},
  entardecer:{label:"fim de tarde",hello:"O sol está indo embora, e o {car} está voltando devagarinho para casa.",idea:["{car} e o pôr do sol cor de laranja","O caminho de volta para casa, com o céu mudando de cor e os amigos dando tchau."],theme:"o fim da tarde, voltando para casa e se preparando para a noite"},
  dormir:{label:"hora de dormir",hello:"Shhh… O {car} está estacionando na garagem para dormir.",idea:["{car} conta as estrelas","Deitado na garagem, o {car} olha pela janela e conta estrelinhas até o sono chegar."],theme:"hora de dormir, uma história calma e aconchegante que termina com o personagem dormindo tranquilo"}
};
let CTX;
function buildContext(){
  const now=new Date();
  CTX={now,p:period(now),se:season(now),dates:nearbyDates(now),
    dow:now.toLocaleDateString("pt-BR",{weekday:"long"}),
    dateStr:now.toLocaleDateString("pt-BR",{day:"numeric",month:"long"}),
    hh:now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
    wknd:[0,6].includes(now.getDay())};
  return CTX;
}
function when(d){if(d===0)return"é hoje";if(d===1)return"é amanhã";if(d===-1)return"foi ontem";return d>0?"daqui a "+d+" dias":"foi há "+(-d)+" dias"}

// As sugestões mostram só o título e uma chamada. Data, horário e estação ficam escondidos no tema enviado à IA.
const SEASON_IDEA={
  primavera:["{car} e o jardim que acordou","Um jardim inteiro acordando de repente.",{cena:"campo",acessorio:"flor"}],
  "verão":["{car} vai à praia","Areia, ondas e um picolé que derrete rápido demais.",{cena:"praia",acessorio:"oculos",amigos:["pipoca"]}],
  outono:["{car} e o vento brincalhão","Um vento que leva tudo pelos ares.",{cena:"campo",rosto:"rindo",amigos:["ze"]}],
  inverno:["{car} e as poças de chuva","Poças para pular e um arco-íris no fim do caminho.",{cena:"chuva",acessorio:"cachecol"}]
};
const PERIOD_ART={manha:{cena:"cidade",amigos:["tonho"]},tarde:{cena:"floresta",rosto:"pensativo",amigos:["lama"]},entardecer:{cena:"campo",amigos:["pipoca"]},dormir:{cena:"noite"}};
function ideas(){
  const {p,se,dates,wknd}=CTX,L=[];
  if(p==="dormir"){
    const calmo=" Uma história calma e aconchegante, que termina com o personagem dormindo tranquilo.";
    L.push({title:fill(PERIOD.dormir.idea[0]),desc:fill(PERIOD.dormir.idea[1]),theme:PERIOD.dormir.theme,art:{cena:"noite"}});

    L.push({title:fill(PERIOD[p].idea[0]),desc:fill(PERIOD[p].idea[1]),theme:PERIOD[p].theme,art:PERIOD_ART[p]});
    const si=SEASON_IDEA[se.name];

    if(wknd)L.push({title:fill("{car} e o passeio sem pressa"),desc:"Um dia sem hora para nada, só para passear.",theme:"um passeio de fim de semana em família, sem pressa",art:{cena:"campo",amigos:["max","tonho"]}});
    else L.push({title:fill("O {car} faz um amigo novo"),desc:fill("Um carrinho tímido chega na rua, e o {car} ajuda ele a se enturmar."),theme:"fazer um amigo novo e ajudar alguém tímido",art:{cena:"cidade",amigos:["tuco"]}});
  }
  return variar(L.slice(0,4)).map(it=>({...it,fixedTitle:true}));

// Varia os personagens das sugestões: muda a cada dia e nunca repete o mesmo amigo nas quatro.
function diaDoAno(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}
function variar(L){
  const pool=ARTE.TURMA.map(t=>t.id),n=pool.length;
  const usados=new Set();L.forEach(it=>(it.art&&it.art.amigos||[]).forEach(a=>usados.add(a)));
  let k=(diaDoAno(CTX.now)*5+["manha","tarde","entardecer","dormir"].indexOf(CTX.p)*3)%n;
  const proximo=()=>{for(let t=0;t<n;t++){const id=pool[(k+t)%n];if(!usados.has(id)){usados.add(id);k=(k+t+4)%n;return id}}return pool[k]};
  let querProta=diaDoAno(CTX.now)%2===0;
  return L.map((it,i)=>{
    if(it.data)return it; // datas comemorativas já têm amigos combinando com o tema
    const amigo=proximo(),info=ARTE.TURMA.find(t=>t.id===amigo);
    const art=Object.assign({},it.art||{});
    const prota=querProta&&it.title.includes(S.car);
    if(prota||!querProta)querProta=!querProta; // se não deu para trocar o protagonista aqui, tenta na próxima
    if(prota){
      const art2=Object.assign({},art,{prota:amigo,amigos:[]});
      const art_=info.genero==="f"?"a":"o";
      const troca=t=>t.replace("O "+S.car,cap(art_)+" "+info.nome).replace("o "+S.car,art_+" "+info.nome).replace(S.car,info.nome);
      return Object.assign({},it,{title:troca(it.title),desc:troca(it.desc),art:art2,prota:amigo});
    }
    art.amigos=[amigo];
    return Object.assign({},it,{art});
  });
}

/* ---------- Folhear ---------- */
let turning=false;
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function go(dir){
  if(turning)return;
  if(cur===CAPA){if(dir>0)openBook();return}
  const q=sequence(),j=q.indexOf(cur)+dir;
  if(j<0||j>=q.length)return;
  goTo(q[j],dir);
}
function goTo(k,dir){
  if(k===cur||turning)return;
  stopSpeak();confirmDel=false;
  if(cur===CAPA)markOpened();
  const pg=$("page");
  if(reduce){cur=k;render();window.scrollTo(0,0);return}
  turning=true;
  pg.classList.add(dir>0?"out-next":"out-prev");
  setTimeout(()=>{
    cur=k;render();window.scrollTo({top:0});
    pg.classList.remove("out-next","out-prev");
    pg.classList.add(dir>0?"in-next":"in-prev");
    setTimeout(()=>{pg.classList.remove("in-next","in-prev");turning=false},320);
  },250);
}
function openBook(){
  if(turning)return;
  markOpened();stopSpeak();
  const pg=$("page");
  if(reduce){cur=SUMARIO;render();window.scrollTo(0,0);return}
  turning=true;pg.classList.add("opening");
  setTimeout(()=>{
    cur=SUMARIO;render();window.scrollTo({top:0});
    pg.classList.remove("opening");pg.classList.add("in-next");
    setTimeout(()=>{pg.classList.remove("in-next");turning=false},320);
  },430);
}
$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("openToc").onclick=()=>{if(cur===CAPA)openBook();else goTo(SUMARIO,-1)};
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,dialog"))return;
  if(e.key==="ArrowLeft")go(-1);
  if(e.key==="ArrowRight")go(1);
});
let tx=null,ty=null;
$("book").addEventListener("touchstart",e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
$("book").addEventListener("touchend",e=>{
  if(tx===null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);
},{passive:true});

    len:S.len||(p==="dormir"?"curta":"media"),bedtime:p==="dormir",

function parse(text){
  let lines=text.replace(/\r/g,"").replace(/<titulo>\s*/i,"TÍTULO: ").replace(/<\/titulo>/i,"").split("\n");
  let title="",start=0,art=null;
  lines=lines.map(l=>l.replace(/^[\s*#_>]+(?=(T[IÍ]TULO|ARTE)\b)/i,"").replace(/^(T[IÍ]TULO|ARTE)\s*[*_]*\s*:\s*[*_]*/i,"$1: "));
  const i=lines.findIndex(l=>/^\s*T[IÍ]TULO\s*:/i.test(l));
  if(i>=0){title=lines[i].replace(/^\s*T[IÍ]TULO\s*:\s*/i,"").replace(/\*+/g,"").trim();start=i+1}
  const j=lines.findIndex(l=>/^\s*ARTE\s*:/i.test(l));
  if(j>=0){if(j<lines.length-1)art=ARTE.lerArte(lines[j]);lines=lines.filter((_,k)=>k!==j)}
  const paras=lines.slice(start).join("\n").trim().split(/\n\s*\n/).map(s=>s.replace(/\n/g," ").trim()).filter(Boolean);
  return{title,paras,art};
}
function paintDraft(){
  if(!draft||cur!==NOVA||!$("pStory"))return;
  $("pTitle").textContent=draft.title;
  $("pStatus").textContent=draft.status||"";
  $("pStory").innerHTML=(draft.paras.length?draft.paras:[""]).map((p,i,a)=>'<p'+(i===a.length-1?' class="caret"':'')+'>'+esc(p)+'</p>').join("");

async function tell(it){
  if(draft)return;
  const chave=chaveDe(it);
  if(!it.forcar){const ja=jaContada(chave);if(ja){markOpened();goTo(ja.id,1);return}}
  buildContext();stopSpeak();markOpened();
  draft={title:it.title,paras:[],status:fill("O {car} está pensando numa história…"),theme:it.theme,p:CTX.p,season:CTX.se.name,art:it.art||null,chave,
    ideia:{title:it.title,theme:it.theme,art:it.art||null,fixedTitle:!!it.fixedTitle,prota:it.prota||""}};
  goTo(NOVA,1);
  ctrl=new AbortController();
  let estourou=false;
  const limite=setTimeout(()=>{estourou=true;ctrl.abort()},60000);
  try{
    const res=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload(it)),signal:ctrl.signal});
    if(!res.ok){let m="";try{m=(await res.json()).erro||""}catch(e){}throw {status:res.status,msg:m}}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf="",text="";
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith("data:"))continue;
        let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
        if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.text){
          text+=ev.delta.text;const r=parse(text);
          draft.title=r.title||it.title;draft.paras=r.paras;draft.status="";
          if(!it.art&&r.art&&!draft.artSet){draft.art=r.art;draft.artSet=true;const f=$("pPhoto");if(f&&cur===NOVA)f.outerHTML=photo(draft.art,draft.p,draft.season,"","","pPhoto")}
          paintDraft();
        }else if(ev.type==="error")throw {status:500};
      }
    }
    const r=parse(text);if(!r.paras.length)throw {status:500};
    if(!it.art&&r.art)draft.art=r.art;
    finish(r.title||it.title,r.paras,"");
  }catch(e){
    if(e&&e.name==="AbortError"&&!estourou){draft=null;return}
    if(estourou)e={msg:"A IA demorou demais para responder."};
    const f=fallback();draft.art=f.art;
    finish(f.title,f.paras,(e&&e.msg)?e.msg+" Enquanto isso, uma história do livrinho.":"Não deu para criar uma história nova agora. Esta é uma do livrinho.",true);
  }finally{clearTimeout(limite)}
}
function finish(title,paras,msg,livrinho){
  // História do livrinho já guardada? Abre a mesma página em vez de salvar outra cópia.
  let s=livrinho?stories.find(x=>x.livrinho&&x.title===title):null;
  if(!s){
    const at=Date.now();
    s={id:"h"+at,title,paras,at,p:draft.p,season:draft.season,theme:draft.theme,art:draft.art||defaultArt(draft.p),chave:draft.chave,ideia:draft.ideia};
    if(livrinho){s.livrinho=true;delete s.chave}
    stories.push(s);save("oua_stories",stories);
  }
  const wasReading=cur===NOVA;
  draft=null;
  if(msg){note=msg;noteFor=s.id}
  if(!livrinho)setTimeout(()=>convidarInstalar("historia"),4000);
  if(wasReading){cur=s.id;render()}
  else if(cur===SUMARIO&&!typing())render();
  else if(cur!==CAPA)render();
}

function tom(f,t0,dur,tipo,vol,f2){
  const a=audio();if(!a)return;
  const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=tipo||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.06,t+.02);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

function falar(svg,alvo,texto){
  const box=svg.parentElement;if(!box)return;
  const rb=box.getBoundingClientRect(),ra=alvo.getBoundingClientRect();
  const b=document.createElement("div");b.className="balao-fala";b.textContent=texto;
  b.style.left=Math.min(Math.max(ra.left+ra.width/2-rb.left,50),rb.width-50)+"px";
  b.style.top=Math.max(ra.top-rb.top+4,26)+"px";
  box.appendChild(b);setTimeout(()=>b.remove(),1900);

    corpo='<h2>Conheça o seu carrinho</h2>'+retrato+
      '<label class="ob-campo">Nome do carrinho<input id="obCar" value="'+esc(OB.car)+'" autocomplete="off" maxlength="20"></label>'+
      '<div class="ob-campo">Cor<div class="colors" id="obCor">'+Object.entries(COLORS).map(([n,col])=>'<button type="button" data-v="'+n+'" aria-label="'+n+'" aria-pressed="'+(n===OB.color)+'" style="background:'+col+'"></button>').join("")+'</div></div>';
  }else if(p===3){
    corpo='<h2>Qual é o jeitinho do '+nomeCarro+'?</h2>'+
      '<div class="ob-chips" id="obJeito">'+JEITOS.map(([t,v],i)=>'<button type="button" data-i="'+i+'" aria-pressed="'+(OB.pers===v)+'">'+t+'</button>').join("")+'</div>'+
      '<p class="nota">Dá para escrever um jeitinho só seu depois, nos Ajustes.</p>'+
      '<label class="ob-campo">Hora de dormir<input id="obBed" type="time" value="'+esc(OB.bed)+'"></label>'+
      '<p class="nota">A partir desse horário, as histórias ficam curtinhas e calmas.</p>'+
      '<label style="display:flex;align-items:center;gap:10px;font-size:1.1rem"><input id="obSom" type="checkbox" '+(OB.som?"checked":"")+' style="width:22px;height:22px"> Sons quando tocar nos personagens</label>';
  }else{
    corpo='<h2>Tudo pronto!</h2>'+retrato+
      (podeConvidar()?'<p class="nota">Dica: instale o app para abrir o diário com um toque, direto da tela inicial.'+(installEvt?' <button class="link" id="obInstalar" type="button">Instalar agora</button>':' No Safari, toque em <b>Compartilhar</b> '+ICONE_PARTILHA+' e depois em <b>Adicionar à Tela de Início</b>.')+'</p>':'')+
      '<p>'+(nomeKid?'O diário de histórias de <b>'+nomeKid+'</b> está pronto. ':'O diário está pronto. ')+'O '+nomeCarro+' e a turma já estão esperando a primeira aventura.</p>';
    botao="Abrir o diário";
  }
  $("onboard").innerHTML='<div class="ob">'+pontos+'<section class="page">'+corpo+
    '<div class="ob-acoes">'+(p>0?'<button class="ob-pular" id="obVoltar">Voltar</button>':'<button class="ob-pular" id="obPular">Pular</button>')+
    '<button class="go" id="obSeguir">'+botao+'</button></div></section></div>';
  const v=id=>$(id);
  if(v("obKid"))v("obKid").oninput=e=>{OB.kid=e.target.value};
  if(v("obBday"))v("obBday").oninput=e=>{OB.bday=e.target.value};
  if(v("obCar"))v("obCar").oninput=e=>{OB.car=e.target.value};
  if(v("obBed"))v("obBed").oninput=e=>{OB.bed=e.target.value};
  if(v("obSom"))v("obSom").onchange=e=>{OB.som=e.target.checked};
  if(v("obIdade"))v("obIdade").onclick=e=>{const b=e.target.closest("button");if(!b)return;OB.age=Number(b.dataset.v);pintarApresentacao()};
  if(v("obCor"))v("obCor").onclick=e=>{const b=e.target.closest("button");if(!b)return;OB.color=b.dataset.v;pintarApresentacao()};
  if(v("obJeito"))v("obJeito").onclick=e=>{const b=e.target.closest("button");if(!b)return;OB.pers=JEITOS[Number(b.dataset.i)][1];pintarApresentacao()};
  if(v("obPular"))v("obPular").onclick=()=>fecharApresentacao(false);
  if(v("obInstalar"))v("obInstalar").onclick=instalarAgora;
  if(v("obVoltar"))v("obVoltar").onclick=()=>{OB.passo--;pintarApresentacao();$("onboard").scrollTop=0};
  v("obSeguir").onclick=()=>{
    if(OB.passo===1&&OB.bday.trim()&&!/^\d{1,2}\/\d{1,2}$/.test(OB.bday.trim())){v("obBday").focus();v("obBday").setCustomValidity("Use o formato dia/mês, como 03/05");v("obBday").reportValidity&&v("obBday").reportValidity();return}
    if(OB.passo>=total-1){fecharApresentacao(true);return}
    OB.passo++;pintarApresentacao();$("onboard").scrollTop=0;
  };
}
$("refazerOnb").onclick=()=>{closeDlg("settings");abrirApresentacao()};

render();
// Primeira vez no app: mostra a apresentação. Quem já usava o app não vê.
if(!load("oua_onboard",false)){
  if(load("hb_set",null))save("oua_onboard",true);
  else abrirApresentacao();
}
// Atualiza as sugestões do sumário quando o momento do dia muda
let lastSig="";
setInterval(()=>{
  if(cur!==SUMARIO||draft||typing())return;
  buildContext();const sig=ideas().map(t=>t.title).join("|")+CTX.p;
  if(lastSig&&sig!==lastSig)render();
  lastSig=sig;
},60000);
})();
</script>
</body>
</html>
